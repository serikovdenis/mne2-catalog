name: Restore missing 120 photo metadata
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/recover-120-registry.yml']
permissions:
  contents: read
concurrency:
  group: recover-120-metadata
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image verifier
        run: python3 -m pip install 'Pillow>=10,<12'
      - name: Verify existing original images and restore missing metadata only
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/recover_120_registry.py --publish
