name: Publish only HJD DTF-12
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hjd-dtf12.yml']
permissions:
  contents: read
concurrency:
  group: mne2-single-hjd-dtf12
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish one product and verify all others unchanged
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish_hjd_dtf12.py
