name: Diagnose 120-card recovery (read-only)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnose-120-recovery.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify public site and existing FTP photo inventory
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, ftplib
          for path in ['/', '/catalog/', '/120/', '/120/data.json']:
              with urllib.request.urlopen('https://mne2.ru'+path, timeout=25) as r:
                  body=r.read()
                  print('HTTPS',path,r.status,len(body))
          password=os.environ.get('FTP_PASSWORD')
          if not password:
              raise SystemExit('FTP_PASSWORD secret is missing; no FTP operation attempted')
          with ftplib.FTP_TLS('p1057897.ftp.ihc.ru', timeout=25) as ftp:
              ftp.login('p1057897_chatgpt',password)
              ftp.prot_p()
              print('FTPS authenticated; protected data channel enabled')
              for path in ['www/mne2.ru/120','www/mne2.ru/catalog/images/120']:
                  ftp.cwd('/')
                  ftp.cwd(path)
                  rows=list(ftp.mlsd())
                  print('INVENTORY',path,json.dumps([{'name':n,'type':f.get('type'),'size':f.get('size')} for n,f in rows],ensure_ascii=False))
          print('READ_ONLY_DIAGNOSTIC_COMPLETE')
          PY
